<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mangal House — Меню</title>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">🔥 MANGAL <span>HOUSE</span></a>
    <button class="menu-toggle" aria-label="Открыть меню">☰</button>
    <nav class="nav">
      <a href="index.html">Главная</a>
      <a class="active" href="menu.html">Меню</a>
      <a href="contacts.html">Контакты</a>
      <button class="cart-button" type="button" onclick="openCart()">Корзина <span id="cartCount">0</span></button>
    </nav>
  </header>

  <main class="menu-page">
    <section class="page-hero">
      <p class="eyebrow">MANGAL HOUSE</p>
      <h1>Наше меню</h1>
      <p>Выбирайте любимые блюда и добавляйте их в корзину.</p>
    </section>

    <section class="menu-tools">
      <input id="menuSearch" type="search" placeholder="🔎 Найти блюдо...">
      <div id="categoryFilters" class="filters"></div>
    </section>

    <section class="section menu-section">
      <div id="menuGrid" class="menu-grid"></div>
    </section>
  </main>

  <button class="floating-cart" onclick="openCart()">🛒 <span id="floatingCartCount">0</span></button>

  <footer class="footer">
    <div><strong>🔥 MANGAL HOUSE</strong><p>Authentic Grill • Street Food</p></div>
    <div><p>Доставка / Самовывоз</p><p>Бесплатная доставка от 1500 ₽</p></div>
  </footer>

  <div id="cartModal" class="modal" aria-hidden="true">
    <div class="modal-card">
      <button class="modal-close" onclick="closeCart()" aria-label="Закрыть">×</button>
      <h2>Ваш заказ</h2>
      <div id="cartItems"></div>
      <div id="cartSummary"></div>
      <form id="orderForm">
        <input id="customerName" type="text" placeholder="Ваше имя" required>
        <input id="customerPhone" type="tel" placeholder="Номер телефона" required>
        <select id="deliveryType">
          <option value="Доставка">Доставка</option>
          <option value="Самовывоз">Самовывоз</option>
        </select>
        <input id="customerAddress" type="text" placeholder="Адрес доставки">
        <textarea id="customerComment" placeholder="Комментарий к заказу"></textarea>
        <button class="btn btn-primary full" type="submit">Отправить заказ</button>
      </form>
      <p class="form-note">После нажатия откроется Telegram с готовым текстом заказа.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
